name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-build:
    name: Build macOS App
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      APP_VERSION: 0.0.0
      APP_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm --dir frontend exec biome check src

      - name: Check Rust core
        run: cargo check --locked

      - name: Build Swift app
        run: swift build

      - name: Package DMG artifact
        run: ./scripts/package-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MockKit-main-${{ github.run_number }}-${{ runner.arch }}
          path: dist/*.dmg
          if-no-files-found: error
